<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>429 - Too Many Requests</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0A192F 0%, #1a2a4a 100%);
            color: #64FFDA;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1 {
            font-size: 4em;
            margin-bottom: 20px;
            color: #64FFDA;
        }

        h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
            color: #8892B0;
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #8892B0;
        }

        .code {
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #64FFDA;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid #64FFDA;
            border-radius: 6px;
            color: #64FFDA;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(100, 255, 218, 0.2);
            transform: translateY(-2px);
        }

        .icon {
            font-size: 3em;
            margin-bottom: 20px;
        }

        #countdown {
            font-size: 2em;
            color: #64FFDA;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚠️</div>
        <h1>429</h1>
        <h2>Too Many Requests</h2>
        <p>You have exceeded the rate limit for this resource.</p>
        <p>This security measure protects against automated attacks and ensures fair usage for all users.</p>
        <p>Please wait <span id="countdown">60</span> seconds before trying again.</p>
        <p><span class="code">Error Code: HTTP 429 - Rate Limit Exceeded</span></p>
        <a href="/" class="back-link">Return to Homepage</a>
    </div>

    <script>
        // Countdown timer
        let seconds = 60;
        const countdownElement = document.getElementById('countdown');

        const timer = setInterval(() => {
            seconds--;
            if (countdownElement) {
                countdownElement.textContent = seconds;
            }

            if (seconds <= 0) {
                clearInterval(timer);
                window.location.reload();
            }
        }, 1000);
    </script>
</body>
</html>
